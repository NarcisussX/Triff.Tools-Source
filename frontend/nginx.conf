map $http_user_agent $br_embed_bot {
    default 0;
    ~*(Discordbot|Twitterbot|Slackbot|facebookexternalhit|LinkedInBot|TelegramBot|WhatsApp|redditbot|Applebot|Googlebot|bingbot) 1;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream triffnix-backend:3000;

    root /usr/share/nginx/html;
    index index.html;

error_page 418 = @br_embed;

location ^~ /br/ {
    if ($br_embed_bot) {
        return 418;
    }

    try_files $uri $uri/ /index.html;
}

location ^~ /triff-local/ {
    if ($br_embed_bot) {
        return 418;
    }

    try_files $uri $uri/ /index.html;
}

location ~ ^/hulls/?$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($br_embed_bot) {
        return 418;
    }
    try_files $uri $uri/index.html /index.html;
}

location @br_embed {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
}
    location ~ ^/api/br/[^/]+/events$ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-transform" always;
    }
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

		location = /index.html {
		    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
		    add_header Pragma "no-cache" always;
		    add_header Expires "0" always;
		    try_files $uri =404;
		}

		

		

		

		location ~* ^/secret/*$ {
		    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
		    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
		    add_header Pragma "no-cache" always;
		    add_header Expires "0" always;
		    add_header Referrer-Policy "no-referrer" always;
		    add_header X-Content-Type-Options "nosniff" always;
		    add_header X-Frame-Options "DENY" always;
		    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
		    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		    try_files /index.html =404;
		}

		location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
